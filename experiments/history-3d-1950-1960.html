<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHILSUNG CIDER — 1950 → 1960 3D 스크롤 프로토타입</title>
  <link rel="stylesheet" href="../css/history-3d.css">
  <link rel="stylesheet" href="../css/jelly-cursor.css">
  <script defer src="../js/jelly-cursor.js"></script>
  <script defer src="../js/vendor/gsap.min.js"></script>
  <script defer src="../js/vendor/ScrollTrigger.min.js"></script>
  <script type="module" src="../js/history-3d.js"></script>
</head>
<body class="history-prototype-page">
  <main>
    <section class="history-3d" id="history-3d" aria-label="1950년에서 1960년까지 패키징이 바뀌는 3D 캔">
      <div class="history-3d-stage">
        <article class="history-3d-era" data-year="1950" data-packaging="../img/history/1950packaging.png">
          <div class="history-3d-era-background" aria-hidden="true"></div><span class="history-3d-year">1950</span>

        </article>
        <article class="history-3d-era" data-year="1960" data-packaging="../img/history/1960packaging.png">
          <div class="history-3d-era-background" aria-hidden="true"></div><span class="history-3d-year">1960</span>

        </article>
        <div class="history-3d-canvas" aria-hidden="true"></div>
        <div class="history-3d-fallback" aria-hidden="true"><img src="../img/history/1950-horizontal-reference.png" alt=""></div>

      </div>
    </section>

  </main>
</body>
</html>
